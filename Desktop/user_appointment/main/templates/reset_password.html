<style>
    .reset-container {
        min-height: 80vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f3f4f6;
        padding: 20px;
    }

    .reset-card {
        background: white;
        width: 380px;
        padding: 30px;
        border-radius: 18px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        animation: fadeIn .4s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .reset-card h2 {
        font-size: 24px;
        font-weight: 700;
        text-align: center;
        margin-bottom: 12px;
        color: #222;
    }

    .reset-card p {
        font-size: 14px;
        text-align: center;
        color: #666;
        margin-bottom: 25px;
    }

    .input-group {
        position: relative;
        width: 100%;
        margin-bottom: 20px;
    }

    .input-group input {
        width: 100%;
        padding: 12px 45px 12px 12px;
        border-radius: 10px;
        border: 1px solid #ccc;
        outline: none;
        font-size: 15px;
        transition: 0.2s;
    }

    .input-group input:focus {
        border-color: #4c84ff;
        box-shadow: 0 0 5px rgba(76,132,255,0.3);
    }

    .toggle-password {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        font-size: 20px;
        color: #666;
    }

    .reset-card button {
        width: 100%;
        padding: 12px;
        background: #4c84ff;
        color: white;
        font-weight: 600;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
    }

    .reset-card button:hover {
        background: #3566e6;
    }

    .message {
        padding: 12px;
        border-radius: 10px;
        margin-bottom: 15px;
        text-align: center;
        font-weight: 600;
    }

    .success-message {
        background: #d1fae5;
        color: #065f46;
    }

    .error-message {
        background: #fee2e2;
        color: #991b1b;
    }
</style>

<div class="reset-container">
    <div class="reset-card">

        <h2>🔑 Nouveau mot de passe</h2>
        <p>Entrez et confirmez votre nouveau mot de passe.</p>

        {% if messages %}
            {% for message in messages %}
                <div class="message 
                    {% if message.tags == 'success' %}success-message{% endif %}
                    {% if message.tags == 'error' %}error-message{% endif %}
                ">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="input-group">
                <input type="password" id="password" name="password" placeholder="Nouveau mot de passe" required>
                <span class="toggle-password" onclick="togglePass('password', this)">👁️</span>
            </div>

            <div class="input-group">
                <input type="password" id="confirm" name="confirm" placeholder="Confirmer" required>
                <span class="toggle-password" onclick="togglePass('confirm', this)">👁️</span>
            </div>

            <button type="submit">Changer</button>
        </form>

    </div>
</div>

<script>
function togglePass(fieldId, icon) {
    const field = document.getElementById(fieldId);
    if (field.type === "password") {
        field.type = "text";
        icon.textContent = "🙈";
    } else {
        field.type = "password";
        icon.textContent = "👁️";
    }
}
</script>
