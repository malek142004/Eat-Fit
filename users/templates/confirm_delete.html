{% extends 'base.html' %}

{% block content %}
<style>
    .delete-card {
        max-width: 500px;
        margin: 80px auto;
        padding: 30px;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0px 6px 20px rgba(0, 0, 0, 0.1);
        text-align: center;
        animation: fadeIn 0.3s ease-out;
    }

    .delete-card h3 {
        font-weight: 700;
        color: #d9534f;
    }

    .delete-warning {
        font-size: 15px;
        color: #555;
        margin-bottom: 20px;
    }

    .btn-danger {
        padding: 10px 20px;
        border-radius: 10px;
        font-weight: 600;
    }

    .btn-secondary {
        padding: 10px 20px;
        border-radius: 10px;
        font-weight: 600;
        margin-left: 10px;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>

<div class="delete-card">
    <h3>⚠️ Suppression du Profil</h3>
    <p class="delete-warning">Êtes-vous sûr de vouloir supprimer votre compte ?<br>
    <b>Cette action est définitive et irréversible.</b></p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Supprimer définitivement</button>
        <a href="{% url 'users:profile' %}" class="btn btn-secondary">Annuler</a>
    </form>
</div>

{% endblock %}
