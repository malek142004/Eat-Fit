<!-- templates/backoffice/coaches/coach_edit_form_snippet.html -->
<form id="coachEditForm" 
      method="post" 
      action="{% url 'backoffice:coach_update_submit' coach.pk %}"
      enctype="multipart/form-data">

    {% csrf_token %}

    {% if user_form.non_field_errors or coach_form.non_field_errors %}
        <div class="alert alert-danger">
            {{ user_form.non_field_errors }}
            {{ coach_form.non_field_errors }}
        </div>
    {% endif %}

    <div class="row">
        <div class="col-lg-6">
            <fieldset class="form-group border p-4 mb-4 rounded bg-white">
                <legend class="w-auto px-3 font-weight-bold text-primary">User Account</legend>
                {{ user_form.as_p }}
            </fieldset>
        </div>
        <div class="col-lg-6">
            <fieldset class="form-group border p-4 rounded bg-white">
                <legend class="w-auto px-3 font-weight-bold text-primary">Coach Profile</legend>
                {{ coach_form.as_p }}
            </fieldset>
        </div>
    </div>

    <div class="text-right mt-3">
        <button type="button" class="btn btn-secondary mr-2" data-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-success btn-lg px-5">
            Update Coach
        </button>
    </div>
</form>
