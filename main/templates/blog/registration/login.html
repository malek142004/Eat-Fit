<!-- templates/registration/login.html -->
{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - EatFit Blog</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/font-awesome.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        body {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('{% static "img/page-top-bg.jpg" %}') center/cover no-repeat fixed;
            height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Playfair Display', serif;
        }
        .login-box {
            background: rgba(255,255,255,0.95);
            padding: 50px 40px;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            max-width: 420px;
        }
        .login-logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .site-btn {
            width: 100%;
            padding: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="login-box">
            <div class="login-logo">
                <img src="{% static 'img/logo.png' %}" alt="Logo" width="80">
                <h3 class="mt-3">Connexion</h3>
            </div>

            {% if form.errors %}
                <div class="alert alert-danger">
                    Identifiants incorrects. Réessayez.
                </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="form-group mb-3">
                    <label>Nom d'utilisateur</label>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>
                <div class="form-group mb-4">
                    <label>Mot de passe</label>
                    <input type="password" name="password" class="form-control" required>
                </div>

                <button type="submit" class217="site-btn sb-gradients">Se connecter</button>
            </form>

            <div class="text-center mt-4">
                <p>Pas encore de compte ? 
   <a href="/admin/" target="_blank">Créer un compte via l’admin</a>
</p>
                <a href="{% url 'blogapp:blog_list' %}" class="text-muted">← Retour au blog</a>
            </div>

            {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
            {% endif %}
        </div>
    </div>
</div>

</body>
</html>
