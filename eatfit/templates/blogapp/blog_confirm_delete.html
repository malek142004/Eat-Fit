{% extends 'base.html' %}
{% block content %}
  <div class="container">
    <h2>Supprimer l'article</h2>
    <p>Es-tu sûr de vouloir supprimer "<strong>{{ blog.title }}</strong>" ?</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Oui, supprimer</button>
      <a href="{% url 'blogapp:blog_detail' blog.pk %}" class="btn btn-secondary">Annuler</a>
    </form>
  </div>
{% endblock %}
