{% extends 'backoffice/base_backoffice.html' %}
{% load static %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4 text-primary">Modifier l'utilisateur: {{ user.nom_complet }}</h2>

    <div class="card shadow-sm">
        <div class="card-body">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="nom_complet" class="form-label">Nom complet:</label>
                    <input type="text" class="form-control" id="nom_complet" name="nom_complet" value="{{ user.nom_complet }}">
                </div>

                <div class="mb-3">
                    <label for="ville" class="form-label">Ville:</label>
                    <input type="text" class="form-control" id="ville" name="ville" value="{{ user.ville }}">
                </div>

                <div class="mb-3">
                    <label for="num_tel" class="form-label">Téléphone:</label>
                    <input type="text" class="form-control" id="num_tel" name="num_tel" value="{{ user.num_tel }}">
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email:</label>
                    <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}">
                </div>

                <div class="mb-3">
                    <label for="role" class="form-label">Rôle:</label>
                    <select class="form-select" id="role" name="role">
                        <option value="client" {% if user.role == 'client' %}selected{% endif %}>Client</option>
                        <option value="business_owner" {% if user.role == 'business_owner' %}selected{% endif %}>Business Owner</option>
                        <option value="nutritionist" {% if user.role == 'nutritionist' %}selected{% endif %}>Nutritionniste</option>
                        <option value="coach" {% if user.role == 'coach' %}selected{% endif %}>Coach</option>
                        <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>Admin</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="pdp" class="form-label">Photo de profil:</label>
                    <input type="file" class="form-control" id="pdp" name="pdp">
                    {% if user.pdp %}
                        <img src="{{ user.pdp.url }}" alt="PDP" class="img-thumbnail mt-2" width="100">
                    {% endif %}
                </div>

                <button type="submit" class="btn btn-primary">Modifier</button>
                <a href="{% url 'users:users_list' %}" class="btn btn-secondary ms-2">Annuler</a>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap CSS si non déjà inclus dans base_backoffice.html -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
{% endblock %}
