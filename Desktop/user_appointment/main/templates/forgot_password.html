<style>
    .forgot-container {
        min-height: 80vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f3f4f6;
        padding: 20px;
    }

    .forgot-card {
        background: white;
        width: 380px;
        padding: 30px;
        border-radius: 18px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        animation: fadeIn .4s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .forgot-card h2 {
        font-size: 24px;
        font-weight: 700;
        text-align: center;
        margin-bottom: 12px;
        color: #222;
    }

    .forgot-card p {
        font-size: 14px;
        text-align: center;
        color: #666;
        margin-bottom: 25px;
    }

    .forgot-card input[type="email"] {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid #ccc;
        outline: none;
        font-size: 15px;
        margin-bottom: 20px;
        transition: 0.2s;
    }

    .forgot-card input[type="email"]:focus {
        border-color: #4c84ff;
        box-shadow: 0 0 5px rgba(76,132,255,0.3);
    }

    .forgot-card button {
        width: 100%;
        padding: 12px;
        background: #4c84ff;
        color: white;
        font-weight: 600;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
    }

    .forgot-card button:hover {
        background: #3566e6;
    }

    .back-link {
        margin-top: 15px;
        text-align: center;
    }

    .back-link a {
        color: #4c84ff;
        text-decoration: none;
        font-size: 14px;
    }

    .back-link a:hover {
        text-decoration: underline;
    }
</style>

<div class="forgot-container">
    <div class="forgot-card">
        {% if messages %}
            <div>
                {% for message in messages %}
                    <div style="
                        padding: 12px;
                        background: #d1fae5;
                        color: #065f46;
                        border-radius: 10px;
                        margin-bottom: 15px;
                        text-align: center;
                        font-weight: 600;
                    ">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <h2>🔐 Mot de passe oublié</h2>

        <p>Entrez votre adresse email pour recevoir un lien de réinitialisation.</p>

        <form method="POST">
            {% csrf_token %}
            {{ form.email }}
            <button type="submit">Envoyer le lien</button>
        </form>

        <div class="back-link">
            <a href="{% url 'users:auth' %}">← Retour à la connexion</a>
        </div>

    </div>
</div>
