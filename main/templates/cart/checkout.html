{% extends 'main/base.html' %}
{% load static %}

{% block extra_css %}
<style>
/* CSS spécifique à la page checkout */
.container { max-width: 800px; }
</style>
{% endblock %}

{% block content %}
<div class="container py-5">
    <h2 class="mb-4">Checkout</h2>

    {% if success %}
        <div class="alert alert-success">
            <strong>Thank you!</strong> Your order has been placed. <br>
            <b>Your order ID: {{ order_id }}</b>
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <label>Full Name</label>
            <input type="text" name="full_name" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Phone Number</label>
            <input type="text" name="phone" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Delivery Address</label>
            <input type="text" name="address" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Additional Notes</label>
            <textarea name="notes" class="form-control"></textarea>
        </div>

        <h4>Total: <span class="text-primary">{{ cart.total_price }} DT</span></h4>
        <button class="btn btn-success mt-3">Confirm Order</button>
    </form>
</div>
{% endblock %}
